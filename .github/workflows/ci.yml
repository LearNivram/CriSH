name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Build with warnings as errors
        run: CFLAGS='-O2 -Werror' make

      - name: Version
        run: ./build/crish --version

      - name: Test suite
        run: ./build/crish tests/run.crsh

      - name: The gaps CriSH exists to close
        run: |
          set -e
          ./build/crish -c 'declare -A m; m[k]=v; [ "${m[k]}" = v ]'
          ./build/crish -c 'v=x; [ "${v^^}" = X ]'
          ./build/crish -c 'printf "a\nb\n" > f; mapfile -t l < f; [ "${#l[@]}" = 2 ]'
          ./build/crish -c 'echo hi > g; sed -i "s/hi/ho/" g; [ "$(cat g)" = ho ]'
          ./build/crish -c 'timeout 1 sleep 5; [ $? -eq 124 ]'
          ./build/crish -c '[ "$(date -u -d @0 +%F)" = 1970-01-01 ]'
          ./build/crish -c 'printf ab > h; [ "$(stat -c %s h)" = 2 ]'
          ./build/crish -c '[ "$(printf abc | sha256sum | cut -c1-8)" = ba7816bf ]'
          echo "all gap checks passed"

  universal:
    name: universal binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for arm64 and x86_64
        run: ./build.sh

      - name: Both slices must be present
        run: |
          archs=$(lipo -archs build/crish)
          echo "architectures: $archs"
          case "$archs" in
            *arm64*) ;; *) echo "no arm64 slice" >&2; exit 1 ;;
          esac
          case "$archs" in
            *x86_64*) ;; *) echo "no x86_64 slice" >&2; exit 1 ;;
          esac

      - name: Nothing but libSystem
        run: |
          otool -L build/crish | tail -n +2 | grep -v '^build/crish' > libs.txt || true
          cat libs.txt
          if grep -qv 'libSystem' libs.txt; then
            echo "unexpected dynamic library" >&2
            exit 1
          fi

      - name: Test the arm64 slice
        run: ./build/crish tests/run.crsh

      # GitHub retired the Intel macOS runners, so the x86_64 slice is
      # exercised through Rosetta on the arm64 runner.  If Rosetta is not
      # there, say so rather than pretend the slice was tested.
      - name: Test the x86_64 slice under Rosetta
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./build/crish --version
            arch -x86_64 ./build/crish tests/run.crsh
          else
            echo "::notice title=x86_64 untested::Rosetta is not available on \
          this runner; the x86_64 slice was built and inspected but not run"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: crish-macos-universal
          path: build/crish
          retention-days: 14

  ubsan:
    name: undefined behaviour
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with UBSan
        run: CFLAGS='-O1 -g -fsanitize=undefined -fno-omit-frame-pointer' make

      - name: Test suite under UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/crish tests/run.crsh

  asan:
    name: address sanitizer
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan
        run: CFLAGS='-O1 -g -fsanitize=address -fno-omit-frame-pointer' make

      # Apple's bundled ASan runtime can deadlock inside its own initializer
      # on recent macOS releases, before main() is reached.  That is a
      # toolchain problem, not a CriSH one, so check for it and skip rather
      # than fail the build on it.  A real ASan finding still fails.
      - name: Test suite under ASan, when the runtime starts at all
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          if ! timeout 60 ./build/crish -c 'echo asan-runtime-ok'; then
            echo "::warning title=ASan skipped::Apple's ASan runtime did not \
          start on this runner; this is a known toolchain deadlock, see \
          docs/building.md"
            exit 0
          fi
          ./build/crish tests/run.crsh

  differential:
    name: same suite under bash 5 and GNU coreutils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The reference toolchain
        run: |
          bash --version | head -1
          sed --version | head -1
          awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1
          sort --version | head -1

      - name: Run the suite under real bash and real GNU tools
        run: bash tests/run.crsh

      - name: Explain
        if: failure()
        run: |
          echo "This job runs tests/run.crsh under bash 5 with GNU coreutils."
          echo "A failure here means the suite itself encodes something that is"
          echo "not real GNU behaviour, so the compatibility claim would be"
          echo "wrong. Fix the test, not the shell."

  shell-scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh and build.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck --severity=warning install.sh build.sh tools/bench.sh
